name: CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/ci.yml'
      - 'scripts/**'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/ci.yml'
      - 'scripts/**'

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: cargo test
        run: cargo test -p rustkyll --verbose

      - name: cargo clippy
        run: cargo clippy -p rustkyll --no-deps -- -D warnings

      - name: cargo fmt --check
        run: cargo fmt --check

  dom-check:
    name: DTC Regression Check
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Clone DTC site (shallow)
        run: |
          git clone --depth 1 https://github.com/DataTalksClub/datatalksclub.github.io.git

      - name: Clone DTC docs (shallow)
        run: |
          git clone --depth 1 https://github.com/DataTalksClub/docs.git dtc-docs

      - name: Build rustkyll (release)
        run: cargo build --release --verbose

      - name: Build DTC with rustkyll
        run: |
          ./target/release/rustkyll build --source datatalksclub.github.io --destination dtc-rustkyll-output

      - name: Build DTC docs with rustkyll
        run: |
          ./target/release/rustkyll build --source dtc-docs --destination dtc-docs-rustkyll-output

      - name: Validate DTC main output
        run: |
          HTML_COUNT=$(find dtc-rustkyll-output -name '*.html' -type f | wc -l)
          TOTAL_COUNT=$(find dtc-rustkyll-output -type f | wc -l)
          echo "DTC main: $HTML_COUNT HTML files, $TOTAL_COUNT total files"
          if [ "$HTML_COUNT" -lt 795 ]; then
            echo "FAIL: DTC main HTML file count ($HTML_COUNT) is below 795"
            exit 1
          fi
          echo "PASS: DTC main $HTML_COUNT HTML files"

      - name: Validate DTC docs output
        run: |
          HTML_COUNT=$(find dtc-docs-rustkyll-output -name '*.html' -type f | wc -l)
          TOTAL_COUNT=$(find dtc-docs-rustkyll-output -type f | wc -l)
          echo "DTC docs: $HTML_COUNT HTML files, $TOTAL_COUNT total files"
          if [ "$HTML_COUNT" -lt 56 ]; then
            echo "FAIL: DTC docs HTML file count ($HTML_COUNT) is below 56"
            exit 1
          fi
          echo "PASS: DTC docs $HTML_COUNT HTML files"
