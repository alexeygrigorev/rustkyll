name: CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/ci.yml'
      - 'scripts/**'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/ci.yml'
      - 'scripts/**'

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: cargo test
        run: cargo test -p rustkyll --verbose

      - name: cargo clippy
        run: cargo clippy -p rustkyll --no-deps -- -D warnings

      - name: cargo fmt --check
        run: cargo fmt --check

  dom-check:
    name: DTC DOM Regression Check
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Clone DTC site (shallow)
        run: |
          git clone --depth 1 https://github.com/DataTalksClub/datatalksclub.github.io.git

      - name: Clone DTC docs (shallow)
        run: |
          git clone --depth 1 https://github.com/DataTalksClub/docs.git dtc-docs

      - name: Cache Ruby gems (DTC main)
        uses: actions/cache@v4
        with:
          path: vendor/bundle-dtc-main
          key: ${{ runner.os }}-gems-dtc-main-${{ hashFiles('datatalksclub.github.io/Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-gems-dtc-main-

      - name: Cache Ruby gems (DTC docs)
        uses: actions/cache@v4
        with:
          path: vendor/bundle-dtc-docs
          key: ${{ runner.os }}-gems-dtc-docs-${{ hashFiles('dtc-docs/Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-gems-dtc-docs-

      - name: Install Jekyll and Bundler
        run: gem install bundler -v '~> 2.5' && gem install jekyll

      - name: Bundle install for DTC site
        run: |
          cd datatalksclub.github.io
          bundle config set --local path '${{ github.workspace }}/vendor/bundle-dtc-main'
          bundle install --jobs 4 --retry 3

      - name: Bundle install for DTC docs
        run: |
          cd dtc-docs
          bundle config set --local path '${{ github.workspace }}/vendor/bundle-dtc-docs'
          bundle install --jobs 4 --retry 3

      - name: Build DTC with Jekyll
        run: |
          cd datatalksclub.github.io
          bundle exec jekyll build

      - name: Build DTC docs with Jekyll
        run: |
          cd dtc-docs
          bundle exec jekyll build

      - name: Build rustkyll (release)
        run: cargo build --release --verbose

      - name: Build DTC with rustkyll
        run: |
          cd datatalksclub.github.io
          ../target/release/rustkyll build --destination ../dtc-rustkyll-output

      - name: Build DTC docs with rustkyll
        run: |
          cd dtc-docs
          ../target/release/rustkyll build --destination ../dtc-docs-rustkyll-output

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Run DOM comparison (DTC main)
        run: |
          uv run scripts/dom_compare.py \
            --jekyll-dir datatalksclub.github.io/_site \
            --rustkyll-dir dtc-rustkyll-output \
            --output dom-report.txt \
            2>&1 | tee dom-output.txt

      - name: Assert DTC main 795/795 matched and 0 diffs
        run: |
          SUMMARY=$(grep '^Summary:' dom-output.txt)
          echo "DOM comparison result: $SUMMARY"

          MATCHED=$(echo "$SUMMARY" | grep -oP '[0-9]+(?= matched)' | head -1)
          DIFFS=$(echo "$SUMMARY" | grep -oP '[0-9]+(?= total differences)' | head -1)
          DIFFS=${DIFFS:-0}

          echo "Matched: $MATCHED"
          echo "Total diffs: $DIFFS"

          if [ "$MATCHED" -lt 795 ]; then
            echo "FAIL: DTC main matched file count ($MATCHED) is below 795"
            exit 1
          fi

          if [ "$DIFFS" -ne 0 ]; then
            echo "FAIL: DTC main total differences ($DIFFS) is not 0"
            exit 1
          fi

          echo "PASS: DTC main $MATCHED files matched, 0 total differences"

      - name: Run DOM comparison (DTC docs)
        run: |
          uv run scripts/dom_compare.py \
            --jekyll-dir dtc-docs/_site \
            --rustkyll-dir dtc-docs-rustkyll-output \
            --output dtc-docs-dom-report.txt \
            2>&1 | tee dtc-docs-dom-output.txt

      - name: Assert DTC docs >= 56 matched and <= 26 diffs
        run: |
          SUMMARY=$(grep '^Summary:' dtc-docs-dom-output.txt)
          echo "DOM comparison result: $SUMMARY"

          MATCHED=$(echo "$SUMMARY" | grep -oP '[0-9]+(?= matched)' | head -1)
          DIFFS=$(echo "$SUMMARY" | grep -oP '[0-9]+(?= total differences)' | head -1)
          DIFFS=${DIFFS:-0}

          echo "Matched: $MATCHED"
          echo "Total diffs: $DIFFS"

          if [ "$MATCHED" -lt 56 ]; then
            echo "FAIL: DTC docs matched file count ($MATCHED) is below 56"
            exit 1
          fi

          if [ "$DIFFS" -gt 26 ]; then
            echo "FAIL: DTC docs total differences ($DIFFS) exceeds 26"
            exit 1
          fi

          echo "PASS: DTC docs $MATCHED files matched, $DIFFS total differences"

      - name: Upload DTC main DOM report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dom-report
          path: |
            dom-report.txt
            dom-output.txt

      - name: Upload DTC docs DOM report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dtc-docs-dom-report
          path: |
            dtc-docs-dom-report.txt
            dtc-docs-dom-output.txt
