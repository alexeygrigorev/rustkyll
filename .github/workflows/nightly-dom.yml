name: Nightly DOM Baseline Check

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  dom-check-all-sites:
    name: DOM Baseline Check (All Sites)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Build rustkyll (release)
        run: cargo build --release --verbose

      # The websites/ directory is gitignored and not available in CI.
      # Clone the DTC site (the most critical site) for nightly checking.
      - name: Set up websites directory
        run: |
          mkdir -p websites/DataTalksClub

      - name: Clone DTC main site (shallow)
        run: |
          git clone --depth 1 \
            https://github.com/DataTalksClub/datatalksclub.github.io.git \
            websites/DataTalksClub/datatalksclub.github.io

      - name: Clone DTC docs (shallow)
        run: |
          git clone --depth 1 \
            https://github.com/DataTalksClub/docs.git \
            websites/DataTalksClub/docs

      - name: Build DTC main with rustkyll
        run: |
          ./target/release/rustkyll build \
            --source websites/DataTalksClub/datatalksclub.github.io \
            --destination websites/DataTalksClub/datatalksclub.github.io/_site

      - name: Build DTC docs with rustkyll
        run: |
          ./target/release/rustkyll build \
            --source websites/DataTalksClub/docs \
            --destination websites/DataTalksClub/docs/_site

      - name: Validate DTC main output
        run: |
          HTML_COUNT=$(find websites/DataTalksClub/datatalksclub.github.io/_site -name '*.html' -type f | wc -l)
          TOTAL_COUNT=$(find websites/DataTalksClub/datatalksclub.github.io/_site -type f | wc -l)
          echo "DTC main: $HTML_COUNT HTML files, $TOTAL_COUNT total files"
          if [ "$HTML_COUNT" -lt 795 ]; then
            echo "FAIL: DTC main HTML file count ($HTML_COUNT) is below 795"
            exit 1
          fi
          echo "PASS: DTC main $HTML_COUNT HTML files"

      - name: Validate DTC docs output
        run: |
          HTML_COUNT=$(find websites/DataTalksClub/docs/_site -name '*.html' -type f | wc -l)
          TOTAL_COUNT=$(find websites/DataTalksClub/docs/_site -type f | wc -l)
          echo "DTC docs: $HTML_COUNT HTML files, $TOTAL_COUNT total files"
          if [ "$HTML_COUNT" -lt 56 ]; then
            echo "FAIL: DTC docs HTML file count ($HTML_COUNT) is below 56"
            exit 1
          fi
          echo "PASS: DTC docs $HTML_COUNT HTML files"

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-dom-report
          path: |
            dom-nightly-report.txt
            dom-report-*.txt
