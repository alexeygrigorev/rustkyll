[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "rustkyll"
version = "0.2.0"
description = "A fast static site generator compatible with Jekyll, written in Rust"
license = {text = "MIT"}
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
    "Topic :: Software Development :: Build Tools",
]

[project.scripts]
rustkyll = "rustkyll._main:main"

[project.urls]
Homepage = "https://github.com/DataTalksClub/rustkyll"
Repository = "https://github.com/DataTalksClub/rustkyll"
Issues = "https://github.com/DataTalksClub/rustkyll/issues"

[tool.setuptools.packages.find]
include = ["rustkyll*"]

[tool.setuptools.package-data]
rustkyll = ["bin/*"]
