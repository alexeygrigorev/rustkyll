<!-- related posts include -->
{% assign related = site.posts | where_exp: "p", "p.url != page.url" | slice: 0, 3 %}
{% if related.size > 0 %}
<section class="related-posts">
<h3>Related Posts</h3>
{% for post in related %}
<a href="{{ post.url }}">{{ post.title }}</a>
{% endfor %}
</section>
{% endif %}
