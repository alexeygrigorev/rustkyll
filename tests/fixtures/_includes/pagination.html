<!-- pagination include -->
{% if include.paginator %}
<div class="pagination">
{% if include.paginator.previous_page %}
<a href="{{ include.paginator.previous_page_path }}">Previous</a>
{% endif %}
{% if include.paginator.next_page %}
<a href="{{ include.paginator.next_page_path }}">Next</a>
{% endif %}
</div>
{% endif %}
