<!DOCTYPE html>
<html>
<head>
{% include head.html %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Article",
  "headline": "{{ page.title }}",
  "url": "{{ site.url }}{{ page.url }}",
  "author": {
    "@type": "Person",
    "name": "{{ page.authors | first }}"
  }
}
</script>
{% include seo-tag.html %}
</head>
<body>
{% include header.html %}
<main>
<article>
<h1>{{ page.title }}</h1>
{% include breadcrumbs.html %}
{{ content }}
</article>
{% include subscribe.html %}
{% include related-posts.html %}
</main>
{% include footer.html %}
</body>
</html>
