[package]
name = "rustkyll"
version = "0.1.1"
edition = "2021"

[dependencies]
chrono = "0.4"
rayon = "1.10"
clap = { version = "4", features = ["derive"] }
kstring = { version = "2.0", features = ["arc"] }
liquid = "0.26"
liquid-core = "0.26"
liquid-lib = { version = "0.26", features = ["jekyll"] }
pulldown-cmark = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
yaml-rust2 = "0.11"
thiserror = "2"
tiny_http = "0.12"
notify = "7"
notify-debouncer-mini = "0.5"
tungstenite = "0.24"

[dev-dependencies]
tempfile = "3"
