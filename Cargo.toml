[workspace]
members = [".", "integration_tests"]

[package]
name = "rustkyll"
version = "0.2.3"
edition = "2021"

[dependencies]
chrono = "0.4"
chrono-tz = "0.10"
iana-time-zone = "0.1"
grass = "0.13"
rand = "0.8"
rayon = "1.10"
clap = { version = "4", features = ["derive"] }
kstring = { version = "2.0", features = ["arc"] }
liquid = "0.26"
liquid-core = { path = "vendor/liquid-core" }
liquid-lib = { path = "vendor/liquid-lib", features = ["jekyll"] }
pulldown-cmark = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
yaml-rust2 = "0.11"
thiserror = "2"
tiny_http = "0.12"
indicatif = "0.17"
notify = "7"
notify-debouncer-mini = "0.5"
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "regex-onig"] }
tungstenite = "0.24"

[dev-dependencies]
tempfile = "3"

[patch.crates-io]
liquid-core = { path = "vendor/liquid-core" }
liquid-lib = { path = "vendor/liquid-lib" }
