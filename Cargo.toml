[package]
name = "rustkyll"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = "0.4"
rayon = "1.10"
clap = { version = "4", features = ["derive"] }
liquid = "0.26"
liquid-core = "0.26"
liquid-lib = { version = "0.26", features = ["jekyll"] }
pulldown-cmark = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
